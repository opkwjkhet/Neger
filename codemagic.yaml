workflows:
  ios-build:
    name: CrackiOSVn Build
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      xcode: latest

    scripts:
      # ======================================================
      # 1. KIEM TRA SOURCE
      # ======================================================
      - name: Check source
        script: |
          echo "======================================"
          echo "SOURCE"
          echo "======================================"

          cd "$CM_BUILD_DIR"

          echo "Current directory:"
          pwd

          echo ""
          echo "Files:"
          ls -la

          echo ""
          echo "Xcode projects:"
          find . \
            -name "*.xcodeproj" \
            -not -path "*/build/*" \
            -not -path "*/Pods/*" \
            -print

          echo ""
          echo "Xcode workspaces:"
          find . \
            -name "*.xcworkspace" \
            -not -path "*/build/*" \
            -not -path "*/Pods/*" \
            -print

      # ======================================================
      # 2. XCODE VERSION
      # ======================================================
      - name: Xcode version
        script: |
          echo "======================================"
          echo "XCODE"
          echo "======================================"

          xcodebuild -version

          echo ""
          echo "iPhoneOS SDK:"
          xcrun --sdk iphoneos --show-sdk-version

      # ======================================================
      # 3. TIM PROJECT
      # ======================================================
      - name: Detect project
        script: |
          cd "$CM_BUILD_DIR"

          echo "======================================"
          echo "DETECT PROJECT"
          echo "======================================"

          PROJECT=$(find . \
            -name "*.xcodeproj" \
            -not -path "*/build/*" \
            -not -path "*/Pods/*" \
            | head -1)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Khong tim thay .xcodeproj"
            exit 1
          fi

          echo "Project:"
          echo "$PROJECT"

          echo "$PROJECT" > /tmp/xcode_project.txt

          echo ""
          echo "Project targets / schemes:"
          xcodebuild -list -project "$PROJECT"

      # ======================================================
      # 4. XOA BUILD CU
      # ======================================================
      - name: Clean output
        script: |
          cd "$CM_BUILD_DIR"

          echo "======================================"
          echo "CLEAN"
          echo "======================================"

          rm -rf "$CM_BUILD_DIR/build"
          rm -rf "$CM_BUILD_DIR/Payload"
          rm -f "$CM_BUILD_DIR/CrackiOSVn.ipa"
          rm -f "$CM_BUILD_DIR/3105.ipa"

          echo "Clean completed"

      # ======================================================
      # 5. BUILD
      #
      # QUAN TRONG:
      # DUNG LAI LENH DA BUILD SUCCEEDED CUA BAN
      # ======================================================
      - name: Build CrackiOSVn
        script: |
          cd "$CM_BUILD_DIR"

          echo "======================================"
          echo "BUILD CrackiOSVn"
          echo "======================================"

          PROJECT=$(cat /tmp/xcode_project.txt)

          echo "Project:"
          echo "$PROJECT"

          echo ""
          echo "Starting xcodebuild..."

          set -eo pipefail

          xcodebuild \
            -project "$PROJECT" \
            -target "3105" \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$CM_BUILD_DIR/build" \
            CONFIGURATION_BUILD_DIR="$CM_BUILD_DIR/build/Release-iphoneos" \
            PRODUCT_NAME=CrackiOSVn \
            EXECUTABLE_NAME=CrackiOSVn \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

          echo ""
          echo "======================================"
          echo "XCODEBUILD COMPLETED"
          echo "======================================"

          # Immediate smoke-check so we fail before the Find step if link failed.
          BUILT_APP="$CM_BUILD_DIR/build/Release-iphoneos/CrackiOSVn.app"
          echo "Expecting: $BUILT_APP"
          if [ ! -d "$BUILT_APP" ]; then
            echo "ERROR: CrackiOSVn.app was not produced"
            find "$CM_BUILD_DIR/build" -name "*.app" -print 2>/dev/null || true
            exit 1
          fi
          if [ ! -f "$BUILT_APP/CrackiOSVn" ]; then
            echo "ERROR: main binary CrackiOSVn missing inside .app"
            ls -la "$BUILT_APP" || true
            /usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$BUILT_APP/Info.plist" || true
            exit 1
          fi
          echo "Binary OK: $(ls -la "$BUILT_APP/CrackiOSVn")"

      # ======================================================
      # 6. DEBUG BUILD OUTPUT
      # ======================================================
      - name: Show build output
        script: |
          cd "$CM_BUILD_DIR"

          echo "======================================"
          echo "BUILD DIRECTORY"
          echo "======================================"

          if [ -d "$CM_BUILD_DIR/build" ]; then
            find "$CM_BUILD_DIR/build" -maxdepth 5 -print
          else
            echo "build directory not found"
          fi

          echo ""
          echo "======================================"
          echo "SEARCH ALL APP FILES"
          echo "======================================"

          find "$CM_BUILD_DIR" \
            -type d \
            -name "*.app" \
            -print 2>/dev/null || true

          echo ""
          echo "======================================"
          echo "SEARCH DERIVED DATA"
          echo "======================================"

          find "$HOME/Library/Developer/Xcode/DerivedData" \
            -type d \
            -name "*.app" \
            -print 2>/dev/null || true

      # ======================================================
      # 7. TIM CrackiOSVn.APP
      # ======================================================
      - name: Find built app
        script: |
          cd "$CM_BUILD_DIR"

          echo "======================================"
          echo "FIND BUILT APP"
          echo "======================================"

          # PRODUCT_NAME is CrackiOSVn (no spaces). Keep legacy "CrackiOSVn.app" fallback.
          CANDIDATES=(
            "$CM_BUILD_DIR/build/Release-iphoneos/CrackiOSVn.app"
            "$CM_BUILD_DIR/build/Release-iphoneos/CrackiOSVn.app"
            "$CM_BUILD_DIR/build/Release-iphoneos/ThreeOneOSFive.app"
            "$CM_BUILD_DIR/build/Release-iphoneos/3105.app"
          )

          APP_PATH=""
          for candidate in "${CANDIDATES[@]}"; do
            echo "Checking: $candidate"
            if [ -d "$candidate" ]; then
              APP_PATH="$candidate"
              break
            fi
          done

          if [ -z "$APP_PATH" ]; then
            echo ""
            echo "Default paths missing — searching build tree for *.app …"
            APP_PATH=$(find "$CM_BUILD_DIR/build" -type d -name "*.app" 2>/dev/null | head -n 1 || true)
          fi

          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo ""
            echo "======================================"
            echo "ERROR: KHONG TIM THAY APP"
            echo "======================================"
            echo ""
            echo "Build tree:"
            find "$CM_BUILD_DIR" -maxdepth 6 -print 2>/dev/null || true
            exit 1
          fi

          echo ""
          echo "======================================"
          echo "APP FOUND"
          echo "======================================"
          echo "$APP_PATH"
          echo "$APP_PATH" > /tmp/app_path.txt

          # Dump Info.plist keys that affect the executable name.
          /usr/libexec/PlistBuddy -c "Print" "$APP_PATH/Info.plist" 2>/dev/null | head -80 || true

          EXECUTABLE_NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP_PATH/Info.plist" 2>/dev/null || true)
          # Strip accidental whitespace from expanded product name.
          EXECUTABLE_NAME=$(printf '%s' "$EXECUTABLE_NAME" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')

          echo "CFBundleExecutable raw: [$EXECUTABLE_NAME]"
          ls -la "$APP_PATH" | head -80

          EXECUTABLE_PATH=""
          if [ -n "$EXECUTABLE_NAME" ] && [ -f "$APP_PATH/$EXECUTABLE_NAME" ]; then
            EXECUTABLE_PATH="$APP_PATH/$EXECUTABLE_NAME"
          else
            # Fallback: first Mach-O binary at bundle root (not a directory / not .dylib).
            echo "Plist executable missing — scanning bundle root for Mach-O …"
            for f in "$APP_PATH"/*; do
              [ -f "$f" ] || continue
              base=$(basename "$f")
              case "$base" in
                Info.plist|PkgInfo|embedded.mobileprovision) continue ;;
              esac
              if file "$f" 2>/dev/null | grep -q "Mach-O"; then
                EXECUTABLE_PATH="$f"
                EXECUTABLE_NAME="$base"
                break
              fi
            done
          fi

          if [ -z "$EXECUTABLE_PATH" ] || [ ! -f "$EXECUTABLE_PATH" ]; then
            echo "ERROR: App bundle does not contain its main executable"
            echo "Bundle listing:"
            find "$APP_PATH" -maxdepth 2 -print 2>/dev/null || true
            exit 1
          fi

          EXECUTABLE_SIZE=$(stat -f%z "$EXECUTABLE_PATH")
          if [ "$EXECUTABLE_SIZE" -lt 100000 ]; then
            echo "ERROR: Main executable is unexpectedly small: $EXECUTABLE_SIZE bytes"
            exit 1
          fi

          echo "Executable: $EXECUTABLE_PATH ($EXECUTABLE_SIZE bytes)"
          echo ""
          echo "App size:"
          du -sh "$APP_PATH"

      # ======================================================
      # 8. TAO PAYLOAD
      # ======================================================
      - name: Create Payload
        script: |
          cd "$CM_BUILD_DIR"

          echo "======================================"
          echo "CREATE PAYLOAD"
          echo "======================================"

          APP_PATH=$(cat /tmp/app_path.txt)

          # Codemagic workflow index/build 1 starts at 1.0.0.
          # Each component is limited to 0...9:
          # build 10 = 1.0.9, build 11 = 1.1.0, build 101 = 2.0.0.
          CI_BUILD_NUMBER=${BUILD_NUMBER:-1}
          VERSION_BASE_BUILD=${VERSION_BASE_BUILD:-1}
          VERSION_OFFSET=$((CI_BUILD_NUMBER - VERSION_BASE_BUILD))
          if [ "$VERSION_OFFSET" -lt 0 ]; then VERSION_OFFSET=0; fi
          VERSION_MAJOR=$((1 + VERSION_OFFSET / 100))
          VERSION_MINOR=$(((VERSION_OFFSET / 10) % 10))
          VERSION_PATCH=$((VERSION_OFFSET % 10))
          APP_VERSION="$VERSION_MAJOR.$VERSION_MINOR.$VERSION_PATCH"
          APP_DISPLAY_NAME="CrackiOSVn [$APP_VERSION]"
          printf '%s' "$APP_VERSION" > /tmp/app_version.txt

          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $APP_VERSION" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :AppReleaseDisplayVersion $APP_VERSION" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $CI_BUILD_NUMBER" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName $APP_DISPLAY_NAME" "$APP_PATH/Info.plist"

          echo "Marketing version: $APP_VERSION"
          echo "Bundle build: $CI_BUILD_NUMBER"
          echo "Display name: $APP_DISPLAY_NAME"

          echo "Source app:"
          echo "$APP_PATH"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: APP_PATH does not exist"
            exit 1
          fi

          rm -rf Payload
          mkdir -p Payload

          echo ""
          echo "Copying app to Payload..."

          cp -R "$APP_PATH" Payload/

          echo ""
          echo "Payload content:"
          find Payload -maxdepth 2 -print

      # ======================================================
      # 9. DONG GOI IPA
      # ======================================================
      - name: Create CrackiOSVn
        script: |
          cd "$CM_BUILD_DIR"

          echo "======================================"
          echo "CREATE IPA"
          echo "======================================"

          IPA_NAME="CrackiOSVn.ipa"
          IPA_PATH="$CM_BUILD_DIR/$IPA_NAME"

          rm -f "$CM_BUILD_DIR/CrackiOSVn.ipa"

          /usr/bin/zip \
            -qry \
            "$IPA_PATH" \
            Payload

          IPA_SIZE=$(stat -f%z "$IPA_PATH")
          if [ "$IPA_SIZE" -lt 100000 ]; then
            echo "ERROR: IPA is unexpectedly small: $IPA_SIZE bytes"
            exit 1
          fi

          if [ ! -f "$IPA_PATH" ]; then
            echo "ERROR: Khong tao duoc $IPA_NAME"
            exit 1
          fi

          printf '%s' "$IPA_PATH" > /tmp/ipa_path.txt

          echo ""
          echo "======================================"
          echo "IPA CREATED"
          echo "======================================"

          ls -lh "$IPA_PATH"

      # ======================================================
      # 10. KIEM TRA IPA
      # ======================================================
      - name: Verify IPA
        script: |
          cd "$CM_BUILD_DIR"

          echo "======================================"
          echo "VERIFY IPA"
          echo "======================================"

          IPA_PATH=$(cat /tmp/ipa_path.txt)
          IPA_NAME=$(basename "$IPA_PATH")

          if [ ! -f "$IPA_PATH" ]; then
            echo "ERROR: $IPA_NAME not found"
            exit 1
          fi

          echo "IPA:"
          ls -lh "$IPA_PATH"

          echo ""
          echo "IPA CONTENT:"
          unzip -l "$IPA_PATH" | head -80

          echo ""
          echo "======================================"
          echo "SUCCESS"
          echo "$IPA_NAME IS READY"
          echo "======================================"

    artifacts:
      - CrackiOSVn.ipa
      - build/Release-iphoneos/**/*.app
      - build/**/*.app
